name: Modelo de proyecciones
on:
  schedule:
    - cron: "0 */3 * * *"   # cada 3 horas (hora UTC)
  workflow_dispatch:         # botón "Run workflow" para correrlo a mano
permissions:
  contents: write
concurrency:
  group: modelo
  cancel-in-progress: false
jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: modelo/requirements.txt
      - run: pip install pandas pyarrow requests
      - run: python modelo/modelo.py
      - name: Guardar resultados
        run: |
          git config user.name "modelo-bot"
          git config user.email "modelo-bot@users.noreply.github.com"
          git add data historial
          git diff --cached --quiet || git commit -m "Modelo: actualización automática"
          git push
