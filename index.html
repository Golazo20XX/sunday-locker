<style>

.lbar{display:flex;gap:6px;margin-bottom:12px}.lbar button{flex:1;background:var(--gr2);border:1px solid var(--ln);color:var(--mu);border-radius:12px;padding:9px 6px;font-size:12px;font-weight:700}.lbar button.on{border-color:var(--li);color:var(--li);background:#1a2313}

.x{background:none;border:0;color:var(--mu);font-size:12px;padding:2px 6px}
.bars{display:flex;align-items:flex-end;gap:3px;height:130px;padding-top:10px}.bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}.bb{width:100%;background:var(--li);border-radius:4px 4px 0 0;min-height:1px}.bv{font-size:9px;color:var(--mu);margin-bottom:2px}.bl{font-size:9px;color:var(--mu);margin-top:3px}
.mt{padding:10px 2px;border-top:1px solid var(--ln)}.mt:first-child{border-top:0}.mt.me{background:#151d10;border-radius:12px;padding:10px 8px;border:1px solid #2e3d1c}.mtr{display:flex;justify-content:space-between;font-size:13px}.mtr .n{font-weight:600}.pbar{height:6px;border-radius:3px;background:#2a3140;margin:6px 0;overflow:hidden}.pbar i{display:block;height:100%;background:var(--li)}
.vg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:6px;text-align:center}.vg div{background:var(--ob);border:1px solid var(--ln);border-radius:8px;padding:3px 0;font-size:12px}.vg small{display:block;font-size:9px;color:var(--mu)}
.kv3{display:grid;grid-template-columns:1fr auto auto;gap:8px 12px}.kv3 b{text-align:right}
.row.sel{background:#1a2313;border-radius:10px}.ck{color:var(--li);font-weight:800;font-size:16px;width:22px;text-align:center} select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--ob);color:var(--tx);font-size:14px;margin:4px 0 6px;font-family:inherit}  
</style>
</head>
<body>

<script>
var D=null,R={},S={tab:'home',sub:{}},FOTO={};
var CFG=JSON.parse(localStorage.getItem('sl_cfg')||'null');
var ICON={
home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
players:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3.2-5.5 6.5-5.5s6 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.6c2.8.2 4.8 2 5.3 5"/>',
matchup:'<path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M9 17h6"/>',
tools:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',

var NAV=[['home','Inicio'],['players','Jugadores'],['matchup','Partido'],['tools','Herramientas'],['profile','Perfil']];
function $(i){return document.getElementById(i)}

 return fetch(u).then(function(r){return r.json()}).then(function(j){if(j.error)throw new Error(j.error);return j})}
var J=null,LIGA=localStorage.getItem('sl_liga')||'';

function cmpData(){var all={};rows('App_RankROS').forEach(function(r){(all[r.Jugador]=all[r.Jugador]||{}).ro=r});rows('App_RankSemana').forEach(function(r){(all[r.Jugador]=all[r.Jugador]||{}).w=r});return all}
