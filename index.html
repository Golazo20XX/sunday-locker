<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sunday Locker</title>
<meta name="theme-color" content="#0A0D13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sunday Locker">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ob:#0A0D13;--gr:#252D3A;--gr2:#161B24;--ln:#2E3746;--tx:#F4F5F7;--mu:#8B95A7;--li:#C8F36A;--cy:#00D1FF;--ok:#4ADE80;--bad:#F87171;--wa:#FBBF24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ob);color:var(--tx);font-family:Inter,system-ui,sans-serif;font-size:14px}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer}
.disp{font-family:Unbounded,Inter,sans-serif;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--ob);transition:opacity .4s}
#splash.hide{opacity:0;pointer-events:none}
#splash img{width:80%;max-width:340px;-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 60%,transparent 72%);mask-image:radial-gradient(circle at 50% 50%,#000 60%,transparent 72%)}
.wm{display:flex;flex-direction:column;align-items:center;margin-top:10px}
.wm b{font-family:Unbounded;font-weight:900;font-size:34px;line-height:1;letter-spacing:1px}
.wm i{font-style:normal;font-family:Unbounded;font-weight:800;font-size:26px;color:var(--li);letter-spacing:3px}
.wm small{letter-spacing:5px;font-size:10px;margin-top:6px;color:var(--tx)}
.tag{position:absolute;bottom:90px;text-align:center;letter-spacing:4px;font-size:12px;font-weight:600}
.tag span{color:var(--li)}
.load{position:absolute;bottom:50px;width:120px;height:3px;border-radius:2px;background:var(--ln);overflow:hidden}
.load i{display:block;height:100%;width:40%;background:var(--li);animation:ld 1.2s infinite ease-in-out}
@keyframes ld{0%{margin-left:-40%}100%{margin-left:100%}}
header{position:sticky;top:0;z-index:10;background:rgba(10,13,19,.94);backdrop-filter:blur(8px);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ln)}
.ib{background:none;border:0;color:var(--tx);padding:6px;position:relative}
.ib svg{width:22px;height:22px}
.badge{position:absolute;top:2px;right:2px;background:var(--li);color:var(--ob);font-size:9px;font-weight:700;border-radius:8px;padding:0 4px}
.hlogo{display:flex;align-items:center;gap:6px}
.hlogo img{height:26px}
.hlogo .t{display:flex;flex-direction:column;line-height:1}
.hlogo .t b{font-family:Unbounded;font-weight:900;font-size:13px}.hlogo .t i{font-style:normal;font-family:Unbounded;font-weight:800;font-size:9px;color:var(--li);letter-spacing:2px}
.ttl{font-size:16px;font-weight:700}
main{padding:14px}
.greet{color:var(--mu);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600}
.week{font-family:Unbounded;font-weight:800;font-size:26px;margin:2px 0 12px}
.card{background:var(--gr2);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--mu);display:flex;justify-content:space-between}
.mu{color:var(--mu)}.sm{font-size:11px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:6px}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:4px}
.vs .nm{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs .pts{font-size:26px;font-weight:700}
.vs .lbl{font-size:9px;color:var(--mu);letter-spacing:1px;text-transform:uppercase}
.vsc{width:34px;height:34px;border-radius:50%;border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--mu)}
.shield{width:38px;height:38px}
.pill{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding:10px 12px;border-radius:12px;font-weight:700;font-size:12px;letter-spacing:.5px;text-transform:uppercase}
.pill.ok{background:linear-gradient(90deg,#2b4a1b,#1d2b16);color:var(--li);border:1px solid #3d5a22}
.pill.wa{background:#3a2a10;color:var(--wa);border:1px solid #5b4314}
.prob{height:6px;border-radius:3px;background:var(--ln);overflow:hidden;margin-top:12px}.prob i{display:block;height:100%;background:var(--li)}
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--ln)}
.row:first-child{border-top:0}
.row .b{flex:1;min-width:0}
.row .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:11px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right}.row .r b{font-size:16px;display:block}.row .r small{font-size:9px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px}
.row.tap{cursor:pointer}.chev{color:var(--mu);font-size:16px}
.pos{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none}
.QB{background:#0b3b52;color:#5fdcff}.RB{background:#173d26;color:#5ee38c}.WR{background:#2e2252;color:#b49cff}.TE{background:#4a2a12;color:#ffa15c}.K{background:#2a2f3a;color:#c3cad6}.DST,.DEF{background:#1f2633;color:#9fb0c8;border:1px solid var(--ln)}.FLEX{background:#33401b;color:var(--li)}
.av{position:relative;overflow:hidden;width:36px;height:36px;border-radius:50%;background:var(--gr);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--mu);flex:none}.av img,.bigav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{font-size:10.5px;background:var(--ob);border:1px solid var(--ln);border-radius:10px;padding:2px 7px;color:var(--mu)}.chip b{color:var(--tx);font-weight:600}
.note{font-size:12px;color:var(--mu);margin-top:6px;line-height:1.35}
.g{color:var(--ok)}.rd{color:var(--bad)}.y{color:var(--wa)}.l{color:var(--li)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:26px;padding:14px;background:var(--li);color:var(--ob);font-weight:800;font-size:13px;letter-spacing:1px;text-transform:uppercase;text-decoration:none;margin:4px 0 14px}
.btn.sec{background:var(--gr);color:var(--tx)}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--ln);margin:0 -14px 12px;padding:0 14px;overflow-x:auto}
.tabs button{background:none;border:0;color:var(--mu);padding:10px 0;font-size:13px;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--li);border-color:var(--li)}
.seg{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.seg button{flex:none;background:none;border:1px solid transparent;color:var(--mu);border-radius:16px;padding:5px 11px;font-size:12px;font-weight:600}
.seg button.on{border-color:var(--li);color:var(--li)}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 10px}.kv b{text-align:right}
.ins{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--ln);cursor:pointer}.ins:first-child{border-top:0}
.ins .ic{width:38px;height:38px;border-radius:50%;border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.ins .b{flex:1}.ins .b b{display:block;font-size:13px}.ins .b span{font-size:11px;color:var(--mu)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--gr2);border:1px solid var(--ln);border-radius:16px;padding:16px 12px;text-align:left;color:var(--tx)}
.tile .e{font-size:24px}.tile b{display:block;margin-top:8px;font-size:14px}.tile span{font-size:11px;color:var(--mu)}
.back{display:flex;align-items:center;gap:8px;margin:-4px 0 10px;color:var(--mu);background:none;border:0;padding:4px 0;font-size:13px}
.msg{padding:9px 0;border-top:1px solid var(--ln);font-size:13px;line-height:1.4}.msg:first-child{border-top:0}.msg b{color:var(--li)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat3 div{background:var(--ob);border:1px solid var(--ln);border-radius:12px;padding:10px 4px}.stat3 b{display:block;font-size:20px;margin-top:4px}.stat3 span{font-size:9px;color:var(--mu);letter-spacing:1px;text-transform:uppercase}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--ob);color:var(--tx);font-size:14px;margin:4px 0 12px;font-family:inherit}
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;background:rgba(10,13,19,.97);border-top:1px solid var(--ln);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;font-weight:600;letter-spacing:.6px;text-transform:uppercase}
nav svg{width:22px;height:22px}
nav button.on{color:var(--li)}
#sheet{position:fixed;inset:0;z-index:30;background:var(--ob);overflow-y:auto;transform:translateY(100%);transition:transform .25s}
#sheet.open{transform:none}
#drawer{position:fixed;inset:0;z-index:40;display:none}
#drawer.open{display:block}
#drawer .bg{position:absolute;inset:0;background:rgba(0,0,0,.55)}
#drawer .pn{position:absolute;top:0;bottom:0;left:0;width:78%;max-width:300px;background:var(--gr2);border-right:1px solid var(--ln);padding:calc(20px + env(safe-area-inset-top)) 16px}
#drawer .pn button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:13px 4px;font-size:15px;border-bottom:1px solid var(--ln)}
.ph{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 6px}
.ph .bigav{position:relative;overflow:hidden;width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;background:var(--gr);border:2px solid var(--li);color:var(--li)}
.ph h2{font-size:24px;margin:10px 0 2px}
.empty{color:var(--mu);font-size:12px;padding:8px 0}
</style>
</head>
<body>
<div id="splash">
  <img src="logo.png" alt="" onload="document.getElementById('wmSplash').style.display='none'" onerror="this.style.display='none'">
  <div class="wm" id="wmSplash"><b>SUNDAY</b><i>— LOCKER —</i><small>FANTASY FOOTBALL</small></div>
  <div class="tag">YOUR ROSTER.<br><span>YOUR SUNDAY.</span></div>
  <div class="load"><i></i></div>
</div>
<header>
  <button class="ib" onclick="drawer(true)" aria-label="Menú"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div id="hc"></div>
  <button class="ib" onclick="go('tools','news')" aria-label="Novedades"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="badge" id="bdg" style="display:none"></span></button>
</header>
<main id="m"></main>
<nav id="nv"></nav>
<div id="sheet"></div>
<div id="drawer"><div class="bg" onclick="drawer(false)"></div><div class="pn" id="dpn"></div></div>
<script>
var D=null,R={},S={tab:'home',sub:{}},FOTO={};
var CFG=JSON.parse(localStorage.getItem('sl_cfg')||'null');
var ICON={
home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
players:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3.2-5.5 6.5-5.5s6 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.6c2.8.2 4.8 2 5.3 5"/>',
matchup:'<path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M9 17h6"/>',
tools:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>'};
var NAV=[['home','Inicio'],['players','Jugadores'],['matchup','Partido'],['tools','Herramientas'],['profile','Perfil']];
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function n(v,d){return typeof v==='number'?v.toFixed(d==null?1:d):esc(v)}
function p(v){return typeof v==='number'?Math.round(v*100)+'%':esc(v)}
function sg(v){return typeof v==='number'?'<span class="'+(v>0.05?'g':v<-0.05?'rd':'')+'">'+(v>0?'+':'')+v.toFixed(1)+'</span>':esc(v)}
function rows(k){return ((D&&D.datos[k])||[]).filter(function(r){var f=r[Object.keys(r)[0]];return f!==''&&f!=='—'&&f!==0&&f!=null})}
function ini(s){s=String(s||'').replace(/ (Jr\.|Sr\.|II|III)$/,'');var a=s.split(' ');return (a[0]||'').charAt(0)+(a.length>1?a[a.length-1].charAt(0):'')}
function img(name,nfl,pos){if(pos==='DST'||pos==='DEF'){var t=String(nfl||'').toLowerCase();if(t==='la')t='lar';return t?'https://sleepercdn.com/images/team_logos/nfl/'+t+'.png':''}var id=FOTO[name];return id?'https://sleepercdn.com/content/nfl/players/thumb/'+id+'.jpg':''}
function av(name,nfl,pos,cls){var u=img(name,nfl,pos);return '<div class="'+(cls||'av')+'">'+esc(ini(name))+(u?'<img src="'+u+'" alt="" loading="lazy" onerror="this.remove()">':'')+'</div>'}
function pb(pos){pos=pos==='DST'?'DEF':pos;return '<div class="pos '+esc(pos)+'">'+esc(pos)+'</div>'}
function card(t,h,x){return '<div class="card">'+(t?'<h3><span>'+t+'</span>'+(x||'')+'</h3>':'')+h+'</div>'}
function tabs(id,o){var c=S.sub[id]||o[0];return '<div class="tabs">'+o.map(function(x){return '<button class="'+(x===c?'on':'')+'" onclick="setSub(\''+id+'\',\''+x+'\')">'+x+'</button>'}).join('')+'</div>'}
function seg(id,o){var c=S.sub[id]||o[0];return '<div class="seg">'+o.map(function(x){return '<button class="'+(x===c?'on':'')+'" onclick="setSub(\''+id+'\',\''+x+'\')">'+x+'</button>'}).join('')+'</div>'}
function cur(id,d){return S.sub[id]||d}
function setSub(id,v){S.sub[id]=v;render()}
function chips(r,list){return '<div class="chips">'+list.map(function(c){var v=r[c[0]];if(v===''||v==null)return '';return '<span class="chip">'+c[1]+' <b>'+(c[2]?c[2](v):n(v))+'</b></span>'}).join('')+'</div>'}
function shield(c){return '<svg class="shield" viewBox="0 0 40 44"><path d="M20 2l16 6v12c0 11-7 18-16 22C11 38 4 31 4 20V8z" fill="#161B24" stroke="'+c+'" stroke-width="2.5"/><path d="M13 20c0-5 3-8 7-8s7 3 7 8-3 9-7 9-7-4-7-9z" fill="'+c+'" opacity=".85"/></svg>'}
function greet(){var h=new Date().getHours();return h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches'}
function fmtP(r,key){return '<div class="r"><b>'+n(r[key])+'</b><small>Proy. pts</small></div>'}
function api(action){var u=CFG.url+(CFG.url.indexOf('?')<0?'?':'&')+'key='+encodeURIComponent(CFG.key)+(action?'&action='+action:'')+'&t='+Date.now();
 return fetch(u).then(function(r){return r.json()}).then(function(j){if(j.error)throw new Error(j.error);return j})}
function setData(j){D=j;R={};FOTO={};(D.datos.App_Resumen||[]).forEach(function(x){R[x.clave]=x.valor});(D.datos.App_Fotos||[]).forEach(function(x){FOTO[x.Jugador]=x['ID Sleeper']});localStorage.setItem('sl_data',JSON.stringify(j))}
function load(action){
 if(!CFG){hideSplash();S.tab='profile';render();return}
 var cache=localStorage.getItem('sl_data');if(cache&&!D){try{setData(JSON.parse(cache));render()}catch(e){}}
 return api(action).then(function(j){setData(j);render();hideSplash()}).catch(function(e){hideSplash();toast('No se pudo actualizar: '+e.message);if(!D){S.tab='profile';render()}})}
function hideSplash(){setTimeout(function(){$('splash').classList.add('hide')},700)}
function toast(t){var d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;left:14px;right:14px;bottom:90px;z-index:60;background:#3a1a1a;border:1px solid #6b2a2a;color:#fff;padding:12px;border-radius:12px;font-size:13px';document.body.appendChild(d);setTimeout(function(){d.remove()},4500)}
function header(){var t={players:'Jugadores',matchup:'Partido',tools:'Herramientas',profile:'Perfil'}[S.tab];
 $('hc').innerHTML=S.tab==='home'?'<div class="hlogo"><img src="icon.png" alt="" onerror="this.remove()"><div class="t"><b>SUNDAY</b><i>—LOCKER—</i></div></div>':'<div class="ttl">'+t+'</div>';
 var k=rows('App_Novedades').filter(function(r){return r['Equipo Fantasy']===R.equipo&&typeof r.Prob==='number'&&r.Prob<0.9}).length;
 $('bdg').style.display=k?'block':'none';$('bdg').textContent=k}
function navBar(){$('nv').innerHTML=NAV.map(function(x){return '<button class="'+(S.tab===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICON[x[0]]+'</svg>'+x[1]+'</button>'}).join('')}
function go(t,tool){S.tab=t;if(tool)S.sub.tool=tool;else if(t==='tools')S.sub.tool='';drawer(false);render();scrollTo(0,0)}
function drawer(o){$('drawer').classList.toggle('open',o);if(o)$('dpn').innerHTML='<div class="hlogo" style="margin-bottom:14px"><img src="icon.png" alt="" onerror="this.remove()"><div class="t"><b>SUNDAY</b><i>—LOCKER—</i></div></div>'+[['Inicio',"go('home')"],['Ranking de la semana',"S.sub.pl='Semana';go('players')"],['Ranking ROS',"S.sub.pl='ROS';go('players')"],['Mi roster',"S.sub.pl='Roster';go('players')"],['Partido y temporada',"go('matchup')"],['Waivers',"go('tools','waivers')"],['Streaming',"go('tools','stream')"],['Trade Analyzer',"go('tools','trades')"],['Novedades',"go('tools','news')"],['Perfil y conexión',"go('profile')"]].map(function(x){return '<button onclick="'+x[1]+'">'+x[0]+'</button>'}).join('')}
function render(){navBar();header();$('m').innerHTML=(D||S.tab==='profile')?V[S.tab]():'<div class="card">Cargando…</div>'}
function openP(name){var f=function(k){return rows(k).filter(function(r){return r.Jugador===name})[0]||{}};
 var w=f('App_RankSemana'),ro=f('App_RankROS'),nv=f('App_Novedades'),rs=f('App_Roster');var pos=w.Pos||ro.Pos||rs.Pos||nv.Pos||'';
 var h='<header style="position:sticky"><button class="ib" onclick="closeP()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button><div class="ttl">Jugador</div><span style="width:34px"></span></header><main>';
 h+='<div class="ph">'+av(name,w.NFL||ro.NFL||rs.NFL||nv.NFL,pos,'bigav')+'<h2>'+esc(name)+'</h2><div class="mu">'+esc(pos)+' · '+esc(w.NFL||ro.NFL||rs.NFL||'')+' · '+esc(w['Dueño']||ro['Dueño']||'')+'</div></div>';
